# Five least-privilege identities, provisioned via SQL once by `make init`
# (services/init/init_clickhouse_users.py, roles/grants defined in
# services/init/config.yml) using the bootstrap identity below - not on every
# `docker compose up`. A fresh volume's `docker compose up` without having
# run `make init` first fails loudly (ACCESS_DENIED/AUTHENTICATION_FAILED) -
# expected, not something any service works around. No service shares a
# login with another - see services/init/config.yml for exactly what each
# role can and can't do.
x-clickhouse-ingest-user: &clickhouse-ingest-user ${CLICKHOUSE_INGEST_USER:?set CLICKHOUSE_INGEST_USER, e.g. in a .env file next to docker-compose.yml}
x-clickhouse-ingest-password: &clickhouse-ingest-password ${CLICKHOUSE_INGEST_PASSWORD:?set CLICKHOUSE_INGEST_PASSWORD, e.g. in a .env file next to docker-compose.yml}
x-clickhouse-grafana-user: &clickhouse-grafana-user ${CLICKHOUSE_GRAFANA_USER:?set CLICKHOUSE_GRAFANA_USER, e.g. in a .env file next to docker-compose.yml}
x-clickhouse-grafana-password: &clickhouse-grafana-password ${CLICKHOUSE_GRAFANA_PASSWORD:?set CLICKHOUSE_GRAFANA_PASSWORD, e.g. in a .env file next to docker-compose.yml}
x-clickhouse-backup-user: &clickhouse-backup-user ${CLICKHOUSE_BACKUP_USER:?set CLICKHOUSE_BACKUP_USER, e.g. in a .env file next to docker-compose.yml}
x-clickhouse-backup-password: &clickhouse-backup-password ${CLICKHOUSE_BACKUP_PASSWORD:?set CLICKHOUSE_BACKUP_PASSWORD, e.g. in a .env file next to docker-compose.yml}
x-clickhouse-loadtest-user: &clickhouse-loadtest-user ${CLICKHOUSE_LOADTEST_USER:?set CLICKHOUSE_LOADTEST_USER, e.g. in a .env file next to docker-compose.yml}
x-clickhouse-loadtest-password: &clickhouse-loadtest-password ${CLICKHOUSE_LOADTEST_PASSWORD:?set CLICKHOUSE_LOADTEST_PASSWORD, e.g. in a .env file next to docker-compose.yml}
x-clickhouse-mcp-stats-user: &clickhouse-mcp-stats-user ${CLICKHOUSE_MCP_STATS_USER:?set CLICKHOUSE_MCP_STATS_USER, e.g. in a .env file next to docker-compose.yml}
x-clickhouse-mcp-stats-password: &clickhouse-mcp-stats-password ${CLICKHOUSE_MCP_STATS_PASSWORD:?set CLICKHOUSE_MCP_STATS_PASSWORD, e.g. in a .env file next to docker-compose.yml}
# Main app database, created by the clickhouse container itself at startup
# (CLICKHOUSE_DB below).
x-clickhouse-database: &clickhouse-database ${CLICKHOUSE_DATABASE:?set CLICKHOUSE_DATABASE, e.g. in a .env file next to docker-compose.yml}
# loadtest's own database, separate from the app's - NOT created by the
# clickhouse container at startup, provisioned instead by `make init`
# (CREATE DATABASE IF NOT EXISTS, since the loadtest role's config in
# services/init/config.yml sets create_database: true).
x-clickhouse-loadtest-database: &clickhouse-loadtest-database ${CLICKHOUSE_LOADTEST_DATABASE:?set CLICKHOUSE_LOADTEST_DATABASE, e.g. in a .env file next to docker-compose.yml}
x-clickhouse-host: &clickhouse-host ${CLICKHOUSE_HOST:-clickhouse}
# Internal-only - webhook/clickhouse-migrate/mcp-dev/mcp-stats/grafana dial
# `clickhouse` directly over the Docker network, never through nginx, and
# that container's actual listen port is already hardcoded (`expose:
# "8123"` below) - so this isn't user-configurable. CLICKHOUSE_HTTP_PORT/
# CLICKHOUSE_NATIVE_PORT below are the ones that control the public,
# nginx-published port.
x-clickhouse-port: &clickhouse-port 8123
x-clickhouse-http-port: &clickhouse-http-port ${CLICKHOUSE_HTTP_PORT:-8123}
x-clickhouse-native-port: &clickhouse-native-port ${CLICKHOUSE_NATIVE_PORT:-9000}
# Pins clickhouse's image and backup's apt-installed clickhouse-client to
# the same version so they can't drift (see both services' Dockerfiles).
x-clickhouse-version: &clickhouse-version ${CLICKHOUSE_VERSION:?set CLICKHOUSE_VERSION - run via `make` (see VERSIONS.yml), not `docker compose` directly}
# Superuser the ClickHouse image creates itself at startup
# (CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 below) - exists only to bootstrap
# the five roles above via SQL. No application service connects as this user
# (restore_clickhouse.sh is the one exception - see the `backup` service).
x-clickhouse-bootstrap-user: &clickhouse-bootstrap-user ${CLICKHOUSE_BOOTSTRAP_USER:?set CLICKHOUSE_BOOTSTRAP_USER, e.g. in a .env file next to docker-compose.yml}
x-clickhouse-bootstrap-password: &clickhouse-bootstrap-password ${CLICKHOUSE_BOOTSTRAP_PASSWORD:?set CLICKHOUSE_BOOTSTRAP_PASSWORD, e.g. in a .env file next to docker-compose.yml}

x-grafana-port: &grafana-port ${GRAFANA_PORT:-3000}
x-mcp-stats-port: &mcp-stats-port ${MCP_STATS_PORT:-8002}

# Host root dir backup/restore scripts read/write ($BACKUP_DIR, default .backups - see README.md's "Backup & restore" section).
# Used directly as ${BACKUP_DIR:-.backups} below, not via an anchor, since anchors can't be concatenated into a bind mount's host-side path.

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-redis-host: &redis-host ${REDIS_HOST:-redis}
# Internal-only - `redis` has no `ports:`/`expose:` at all, never visible on
# the host, so this isn't user-configurable.
x-redis-port: &redis-port 6379

# Points at load-balancer (nginx), not a single webhook replica - see that
# service below for why (two stateless replicas, load-balanced).
x-webhook-metrics-url: &webhook-metrics-url ${WEBHOOK_METRICS_URL:-http://load-balancer:8000/api/v1/metrics}
# LiteLLM's native alerting webhook (budget/outage/exception alerts).
x-litellm-alert-webhook-url: &litellm-alert-webhook-url ${WEBHOOK_URL:-http://load-balancer:8000/api/v1/litellm-alert}
x-webhook-port: &webhook-port ${WEBHOOK_PORT:-8010}

x-litellm-port: &litellm-port ${LITELLM_PORT:-4000}
x-litellm-master-key: &litellm-master-key ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY, e.g. in a .env file next to docker-compose.yml}
x-litellm-db-password: &litellm-db-password ${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD, e.g. in a .env file next to docker-compose.yml}
x-litellm-db-url: &litellm-db-url postgresql://litellm:${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD, e.g. in a .env file next to docker-compose.yml}@litellm-db:5432/litellm
# Container-internal port is fixed at 4000 (baked into the Dockerfile CMD)
# regardless of LITELLM_PORT, which only remaps the host side. Used by
# webhook to call /key/info when verifying report_git_branch.py's key.
x-litellm-base-url: &litellm-base-url http://litellm:4000

# Anthropic/OpenAI-wire fallback proxy ports on load-balancer (nginx.conf's
# `listen 4001`/`listen 4002` blocks) - proxy straight to litellm normally,
# re-route to api.anthropic.com/api.openai.com if litellm doesn't respond.
# See agent_docs/services/load-balancer.md.
x-anthropic-proxy-port: &anthropic-proxy-port ${ANTHROPIC_PROXY_PORT:-4001}
x-openai-proxy-port: &openai-proxy-port ${OPENAI_PROXY_PORT:-4002}

# Shared by both webhook replicas (webhook-1/webhook-2) below. Connects as
# the `ingest` role (INSERT-only + a narrow SELECT list - see
# services/init/config.yml).
x-webhook-env: &webhook-env
  CLICKHOUSE_HOST: *clickhouse-host
  CLICKHOUSE_PORT: *clickhouse-port
  CLICKHOUSE_USER: *clickhouse-ingest-user
  CLICKHOUSE_PASSWORD: *clickhouse-ingest-password
  CLICKHOUSE_DATABASE: *clickhouse-database
  REDIS_HOST: *redis-host
  REDIS_PORT: *redis-port
  # For /key/info lookups verifying report_git_branch.py's auth header.
  LITELLM_MASTER_KEY: *litellm-master-key
  LITELLM_BASE_URL: *litellm-base-url
  APP_VERSION: ${WEBHOOK_TAG}

# Prometheus's own web UI (/graph, /targets, etc.) - lives behind the
# `observability` compose profile (opt-in, loaded via docker-compose.observability.yml,
# see "Observability" in README.md), gatewayed through load-balancer like
# everything else instead of publishing its own host port directly.
x-prometheus-port: &prometheus-port ${PROMETHEUS_PORT:-9090}

# Langfuse (LLM tracing, fed by litellm's callbacks in config.yaml) - its
# own Postgres/ClickHouse/Redis/MinIO, kept separate so schemas never collide
# with the agent-tracking stack above.
x-langfuse-port: &langfuse-port ${LANGFUSE_PORT:-3001}
# Langfuse lives behind the `langfuse` compose profile (opt-in, loaded via
# docker-compose.langfuse.yml, see "Langfuse" in README.md).
# Fixed container-internal port, same pattern as litellm-base-url above.
x-langfuse-base-url: &langfuse-base-url http://langfuse-web:3000

services:
  clickhouse:
    # Config (schema.sql, config.d/*.xml) is baked in at build time - a
    # change needs `docker compose build clickhouse`, not just a restart.
    build:
      context: ./services/clickhouse
      args:
        CLICKHOUSE_VERSION: *clickhouse-version
    image: receipt-goblin-clickhouse:${CLICKHOUSE_TAG:?run via `make`, not `docker compose` directly - see VERSIONS.yml}
    container_name: receipt-goblin-clickhouse
    environment:
      # Bootstrap superuser only (see x-clickhouse-bootstrap-* above), not any of the app roles.
      # ACCESS_MANAGEMENT=1 lets `make init` (services/init/) provision every role via SQL; the image drops the "default" account entirely in this mode.
      CLICKHOUSE_USER: *clickhouse-bootstrap-user
      CLICKHOUSE_PASSWORD: *clickhouse-bootstrap-password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_DB: *clickhouse-database
    # 3.6x observed peak (419MiB) - heaviest CPU user; analytical
    # CTE/window-function panels can spike well above idle.
    mem_limit: 4g
    # Generous, not tight - a hard CFS quota that's too low turns into
    # throttling-induced query latency, which would defeat the point.
    # Sized so ClickHouse alone can't starve everything else sharing the
    # VM's cores (see loadtest below for why that matters).
    cpus: 3.0
    restart: always
    labels:
      - autoheal=true
    expose:
      # HTTP (people/tools querying ClickHouse directly - e.g. clickhouse-client,
      # DBeaver, ad-hoc curl) and native protocol - both published via
      # load-balancer below now, not directly, so they go through the same
      # gateway as everything else.
      - "8123"
      - "9000"
      # Metrics endpoint (config.d/prometheus.xml) - internal only, scraped
      # by Prometheus's `clickhouse` job.
      - "9363"
    logging: *default-logging
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Backing disk for native BACKUP/RESTORE (backup_clickhouse.sh) - the server writes/reads here directly, bind-mounted so files land on the host.
      # Data only; config.d/backups.xml pointing here is baked in.
      - ${BACKUP_DIR:-.backups}/clickhouse:/backups/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - receipt-goblin

  clickhouse-migrate:
    # Applies any services/clickhouse/migrations/*.sql not yet in schema_migrations, plus the one-time dashboard Dictionaries.
    # Idempotent, safe to re-run - see migrate.py's docstring.
    # Never touches ClickHouse users/roles/grants - that's `make init` alone (services/init/), run once, not here.
    # Not started by `docker compose up` (profiles: tools) - run via `make migrate`.
    # Operators are responsible for running it before/after adding new migration files, or before bringing up services that depend on new schema/dictionaries.
    # Build context is the repo root - see services/migrate/Dockerfile.
    build:
      context: .
      dockerfile: services/migrate/Dockerfile
      args:
        - PYTHON_VERSION=${PYTHON_VERSION}
    image: receipt-goblin-migrate:${MIGRATE_TAG:?run via `make`, not `docker compose` directly - see VERSIONS.yml}
    container_name: receipt-goblin-clickhouse-migrate
    profiles:
      - tools
    restart: "no"
    logging: *default-logging
    environment:
      CLICKHOUSE_HOST: *clickhouse-host
      CLICKHOUSE_PORT: *clickhouse-port
      CLICKHOUSE_DATABASE: *clickhouse-database
      # Embedded (as string literals, see migrate.py's docstring) into the dashboard Dictionaries' SOURCE(CLICKHOUSE(...)) clause - the only role identity this file needs to know about.
      CLICKHOUSE_INGEST_USER: *clickhouse-ingest-user
      CLICKHOUSE_INGEST_PASSWORD: *clickhouse-ingest-password
      # Bootstrap superuser - migrate.py's own DDL (schema_migrations, migrations/*.sql, dictionaries) needs rights no least-privilege role should hold.
      CLICKHOUSE_BOOTSTRAP_USER: *clickhouse-bootstrap-user
      CLICKHOUSE_BOOTSTRAP_PASSWORD: *clickhouse-bootstrap-password
    mem_limit: 256m
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - receipt-goblin

  grafana:
    # Config/dashboards baked into the image at build time - a change needs
    # `docker compose build grafana` in prod; docker-compose.dev.yml
    # bind-mounts them back for live editing.
    build: ./services/grafana
    image: receipt-goblin-grafana:${GRAFANA_TAG:?run via `make`, not `docker compose` directly - see VERSIONS.yml}
    container_name: receipt-goblin-grafana
    environment:
      CLICKHOUSE_HOST: *clickhouse-host
      CLICKHOUSE_PORT: *clickhouse-port
      CLICKHOUSE_USER: *clickhouse-grafana-user
      CLICKHOUSE_PASSWORD: *clickhouse-grafana-password
      CLICKHOUSE_DATABASE: *clickhouse-database
    mem_limit: 1g
    restart: always
    labels:
      - autoheal=true
    logging: *default-logging
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - receipt-goblin

  mcp-stats:
    # Prod-facing MCP server (fixed statistics tools, e.g. whatsup) - ships alongside litellm/grafana.
    # Unlike mcp-dev (dev-only, arbitrary SQL, no auth), every request other than /health/`/metrics` must carry a valid LiteLLM virtual key - see services/mcp-stats/src/server.py's AuthMiddleware.
    # depends_on litellm since auth calls its /key/info.
    build:
      context: .
      dockerfile: services/mcp-stats/Dockerfile
      args:
        - PYTHON_VERSION=${PYTHON_VERSION}
    image: receipt-goblin-mcp-stats:${MCP_STATS_TAG:?run via `make`, not `docker compose` directly - see VERSIONS.yml}
    container_name: receipt-goblin-mcp-stats
    environment:
      CLICKHOUSE_HOST: *clickhouse-host
      CLICKHOUSE_PORT: *clickhouse-port
      CLICKHOUSE_MCP_STATS_USER: *clickhouse-mcp-stats-user
      CLICKHOUSE_MCP_STATS_PASSWORD: *clickhouse-mcp-stats-password
      CLICKHOUSE_DATABASE: *clickhouse-database
      MCP_STATS_PORT: *mcp-stats-port
      LITELLM_MASTER_KEY: *litellm-master-key
      LITELLM_BASE_URL: *litellm-base-url
    mem_limit: 256m
    restart: always
    labels:
      - autoheal=true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      clickhouse:
        condition: service_healthy
      litellm:
        condition: service_healthy
    networks:
      - receipt-goblin

  redis:
    # Queue between webhook (producer) and worker (consumer) - see
    # services/webhook/src/queue.py and services/worker/src/queue.py.
    # Tuning lives in redis.conf, baked in at build time -
    # no dev override for this one, rarely edited live.
    build: ./services/redis
    image: receipt-goblin-redis:${REDIS_TAG:?run via `make`, not `docker compose` directly - see VERSIONS.yml}
    container_name: receipt-goblin-redis
    # Above redis.conf's maxmemory (1024mb) - headroom for Redis's own
    # overhead beyond the dataset.
    mem_limit: 1200m
    # Redis is single-threaded for command execution - 1 core is already
    # generous headroom, and capping it stops one runaway XADD/XREADGROUP
    # burst from crowding out webhook/worker's own CPU share.
    cpus: 1.0
    restart: always
    labels:
      - autoheal=true
    logging: *default-logging
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - receipt-goblin

  # Two stateless replicas behind load-balancer, instead of one instance (webhook only produces onto Redis - see services/webhook/src/queue.py - so any request can land on either).
  # Fixed names + static IPs (below) are needed for load-balancer's nginx.conf upstream block to do real least_conn balancing.
  # Duplicated instead of `docker compose up --scale` so each replica keeps its own container_name/healthcheck.
  webhook-1: &webhook-service
    # Prod image is self-contained (config.yml baked in; build context is
    # the repo root - see services/webhook/Dockerfile). docker-compose.dev.yml
    # bind-mounts ./src over /app/src and adds `command: --reload` for live
    # editing; dependency changes still need `make lock` plus a rebuild either way.
    build:
      context: .
      dockerfile: services/webhook/Dockerfile
      args:
        - PYTHON_VERSION=${PYTHON_VERSION}
    # Webhook-specific image - used only by webhook-1/2 replicas.
    image: receipt-goblin-webhook:${WEBHOOK_TAG:?run via `make`, not `docker compose` directly - see VERSIONS.yml}
    container_name: receipt-goblin-webhook-1
    environment: *webhook-env
    # Was 256m before build_event()/json parsing moved off webhook's request
    # path onto webhook-worker (see "Why a queue in front of ClickHouse").
    # Now 128m - real peak under 100-user load with the raw-bytes-passthrough
    # path was ~72-74MB, ~1.7x margin.
    mem_limit: 128m
    cpus: 1.0
    restart: always
    labels:
      - autoheal=true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Static IP - see load-balancer/nginx.conf's upstream block, which
    # addresses this replica directly by IP (not hostname) so its least_conn
    # balancing survives a recreate without needing DNS re-resolution.
    networks:
      receipt-goblin:
        ipv4_address: 172.28.1.11

  webhook-2:
    <<: *webhook-service
    container_name: receipt-goblin-webhook-2
    networks:
      receipt-goblin:
        ipv4_address: 172.28.1.12

  # Docker only marks a container "unhealthy" on failed healthcheck - it doesn't restart it.
  # (restart: always only reacts to process exit.)
  # This watches containers labeled autoheal=true and restarts them on unhealthy,
  # covering the case where the process is alive but stuck (e.g. lost network/DNS to a dependency).
  autoheal:
    image: willfarrell/autoheal
    container_name: receipt-goblin-autoheal
    restart: always
    logging: *default-logging
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  load-balancer:
    # Load-balances the two webhook replicas above (real least_conn - see
    # nginx.conf) and gateways litellm/grafana/mcp-dev/mcp-stats/clickhouse/
    # prometheus/langfuse-web too - see AGENTS.md "Gateway (`load-balancer`)".
    # Only this service publishes host ports; the backends it fronts are
    # internal-network-only.
    build: ./services/load-balancer
    image: receipt-goblin-load-balancer:${LOAD_BALANCER_TAG:?run via `make`, not `docker compose` directly - see VERSIONS.yml}
    container_name: receipt-goblin-load-balancer
    environment:
      # Consumed only by docker-entrypoint.d/50-render-index-html.sh (the
      # landing page's port links) - nginx.conf's own `listen` ports below
      # are unrelated and stay hardcoded, since only the host-published side
      # is ever configurable (see the `ports:` list's own comments).
      WEBHOOK_PORT: *webhook-port
      LITELLM_PORT: *litellm-port
      GRAFANA_PORT: *grafana-port
      MCP_STATS_PORT: *mcp-stats-port
      CLICKHOUSE_HTTP_PORT: *clickhouse-http-port
      PROMETHEUS_PORT: *prometheus-port
      LANGFUSE_PORT: *langfuse-port
      ANTHROPIC_PROXY_PORT: *anthropic-proxy-port
      OPENAI_PROXY_PORT: *openai-proxy-port
    logging: *default-logging
    ports:
      # Landing page (nginx.conf's `listen 80` block, index.html) - fixed at
      # 80, not a `${..._PORT:-default}` var like every port below, since
      # it's the one meant to be reachable at the plain http://localhost
      # root with no port at all.
      - target: 80
        published: 80
      - target: 8000
        published: *webhook-port
      - target: 4000
        published: *litellm-port
      - target: 3000
        published: *grafana-port
      - target: 8002
        published: *mcp-stats-port
      - target: 8123
        published: *clickhouse-http-port
      - target: 9000
        published: *clickhouse-native-port
      # prometheus (opt-in `observability` profile) - 502s per-request until
      # that profile is actually started, same as langfuse-web below.
      - target: 9090
        published: *prometheus-port
      # langfuse-web (opt-in `langfuse` profile) - see nginx.conf's `listen
      # 3001` block for why the target isn't 3000 (already grafana's).
      - target: 3001
        published: *langfuse-port
      # litellm-with-Anthropic/OpenAI-fallback (nginx.conf's `listen 4001`/
      # `listen 4002` blocks) - see the anchors above.
      - target: 4001
        published: *anthropic-proxy-port
      - target: 4002
        published: *openai-proxy-port
    mem_limit: 64m
    # Was 0.5 - hit 100% of that under the 100-user load test (real,
    # unsmoothed peak, not a docker-stats sampling artifact - see
    # AGENTS.md's load-test history), while every other gateway'd backend
    # still had headroom. It's fronting webhook/litellm/grafana/mcp-dev/mcp-stats/
    # clickhouse/langfuse-web all at once, so it's worth more than 0.5 cores.
    cpus: 1.0
    restart: always
    labels:
      - autoheal=true
    healthcheck:
      # 127.0.0.1, not localhost - nginx.conf only binds IPv4 here, and
      # localhost resolves to ::1 first (same issue as langfuse-web above).
      # Checks the webhook port only - representative of the gateway process
      # itself being up, not a per-backend check (each backend already has
      # its own healthcheck + depends_on below).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Deliberately no depends_on at all: nginx doesn't need any backend up
    # to start (it just 502s a request until one's reachable, self-healing
    # via the `resolver`/stream blocks + the webhook_backend upstream's
    # passive checks in nginx.conf), and load-balancer shouldn't force
    # anyone to bring up webhook-1/2/litellm/grafana/mcp-dev/mcp-stats/clickhouse
    # just to start it, or vice versa - each of those should be startable
    # (or skippable) on its own.
    networks:
      - receipt-goblin

  worker:
    # Drains common/config/queue.py's STREAM_KEY stream in batches and does the ClickHouse inserts.
    # See worker.py.
    build:
      context: .
      dockerfile: services/worker/Dockerfile
      args:
        - PYTHON_VERSION=${PYTHON_VERSION}
    image: receipt-goblin-worker:${WORKER_TAG:?run via `make`, not `docker compose` directly - see VERSIONS.yml}
    container_name: receipt-goblin-worker
    environment:
      CLICKHOUSE_HOST: *clickhouse-host
      CLICKHOUSE_PORT: *clickhouse-port
      CLICKHOUSE_USER: *clickhouse-ingest-user
      CLICKHOUSE_PASSWORD: *clickhouse-ingest-password
      CLICKHOUSE_DATABASE: *clickhouse-database
      REDIS_HOST: *redis-host
      REDIS_PORT: *redis-port
    expose:
      - "9200"
    # Was 256m - steady-state usage already sat at ~75% of that.
    # Batches backing up under load (growing toward BATCH_SIZE) pushed it into silent OOM kills (no python traceback, container just restarted - confirmed via docker inspect RestartCount + logs stopping mid-batch).
    mem_limit: 512m
    # Bumped from 1.0 after build_event() moved here from webhook (see AGENTS.md "Why a queue in front of ClickHouse").
    # Worker now absorbs both the CPU-bound parsing and the ClickHouse batch inserts.
    # Load testing showed it pegged at ~97% of 1.0 under sustained load.
    cpus: 2.0
    restart: always
    labels:
      - autoheal=true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "from src.queue import get_redis; get_redis().ping()"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - receipt-goblin

  metrics-reparse:
    # CLI-only service that recomputes calculated_type/calculated_payload for existing event_sources rows.
    # See reparse.py.
    # Not started by `docker compose up` (profiles: tools) - run via `make reparse`/`make reparse-all`.
    build:
      context: .
      dockerfile: services/reparse/Dockerfile
      args:
        - PYTHON_VERSION=${PYTHON_VERSION}
    image: receipt-goblin-reparse:${REPARSE_TAG:?run via `make`, not `docker compose` directly - see VERSIONS.yml}
    container_name: receipt-goblin-metrics-reparse
    profiles:
      - tools
    environment:
      CLICKHOUSE_HOST: *clickhouse-host
      CLICKHOUSE_PORT: *clickhouse-port
      CLICKHOUSE_USER: *clickhouse-ingest-user
      CLICKHOUSE_PASSWORD: *clickhouse-ingest-password
      CLICKHOUSE_DATABASE: *clickhouse-database
      SESSION_ID: ${SESSION_ID:-}
    # reparse.py pages event_sources REPARSE_CHUNK_SIZE rows at a time instead of buffering the whole table client-side.
    # This doesn't need headroom for a full 300MB+ payload-text load.
    mem_limit: 256m
    logging: *default-logging
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - receipt-goblin

  loadtest-fixtures:
    # Standalone service, own image/build context (services/loadtest-fixtures/, not services/webhook/Dockerfile) and its own minimal ClickHouse client - deliberately isolated from webhook's codebase, see AGENTS.md.
    # Extracts real, already-ingested traffic straight out of ClickHouse (agent_events + ingest_raw) into JSON fixture files under loadtest-fixtures-data, sized by LOADTEST_FIXTURES_VOLUME - see src/build_fixtures.py.
    # Not started by `docker compose up` (profiles: tools) - run via `make loadtest-fixtures`/`make loadtest-fixtures-status`.
    build:
      context: .
      dockerfile: services/loadtest-fixtures/Dockerfile
      args:
        - PYTHON_VERSION=${PYTHON_VERSION}
    image: receipt-goblin-loadtest-fixtures:${LOADTEST_FIXTURES_TAG:?run via `make`, not `docker compose` directly - see VERSIONS.yml}
    container_name: receipt-goblin-loadtest-fixtures
    profiles:
      - tools
    environment:
      # Every var this service reads is prefixed LOADTEST_FIXTURES_ - see
      # its own src/config.py - so its container environment never collides
      # with webhook's own bare CLICKHOUSE_* names.
      LOADTEST_FIXTURES_CLICKHOUSE_HOST: *clickhouse-host
      LOADTEST_FIXTURES_CLICKHOUSE_PORT: *clickhouse-port
      LOADTEST_FIXTURES_CLICKHOUSE_USER: *clickhouse-ingest-user
      LOADTEST_FIXTURES_CLICKHOUSE_PASSWORD: *clickhouse-ingest-password
      LOADTEST_FIXTURES_CLICKHOUSE_DATABASE: *clickhouse-database
      LOADTEST_FIXTURES_VOLUME: ${LOADTEST_FIXTURES_VOLUME:-medium}
    volumes:
      - loadtest-fixtures-data:/app/loadtest_fixtures
    # build_fixtures.py pages ingest_raw fixtures_chunk_size rows at a time
    # instead of buffering the whole payload set client-side, same rationale
    # as metrics-reparse's mem_limit below.
    # Bumped from 256m after real OOM confirmed on VOLUME=small (payloads
    # average ~276KB, up to 1.8MB - bigger than the original limit assumed).
    mem_limit: 1024m
    logging: *default-logging
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - receipt-goblin

  loadtest:
    # CLI-only service that replays real traffic extracted into loadtest-fixtures-data.
    # See the separate loadtest-fixtures service/src/build_fixtures.py.
    # Replays traffic against webhook's POST /api/v1/metrics at a ramping concurrency profile - see src/loadtest.py.
    # Not started by `docker compose up` (profiles: tools) - run via `make loadtest`.
    build:
      context: .
      dockerfile: services/loadtest/Dockerfile
      args:
        - PYTHON_VERSION=${PYTHON_VERSION}
    image: receipt-goblin-loadtest:${LOADTEST_TAG:?run via `make`, not `docker compose` directly - see VERSIONS.yml}
    container_name: receipt-goblin-loadtest
    profiles:
      - tools
    environment:
      # TARGET_URL is deliberately its own override (not WEBHOOK_METRICS_URL) so this can point at a different host (staging/prod) without touching the webhook service's own URL var.
      # Defaults at load-balancer, same as litellm's real traffic, so the load test exercises the balancer too - not just one replica directly.
      TARGET_URL: ${TARGET_URL:-http://load-balancer:8000/api/v1/metrics}
      START_USERS: ${START_USERS:-10}
      END_USERS: ${END_USERS:-100}
      RAMP_STEPS: ${RAMP_STEPS:-10}
      RAMP_STEP_MINUTES: ${RAMP_STEP_MINUTES:-1}
      HOLD_MINUTES: ${HOLD_MINUTES:-5}
      DURATION_MINUTES: ${DURATION_MINUTES:-0}
      SPEED: ${SPEED:-1.0}
    volumes:
      # Read-only - this is the replay corpus, no writes needed (unlike
      # loadtest-fixtures' own read-write mount for generating fixtures).
      - loadtest-fixtures-data:/app/loadtest_fixtures:ro
    # Previously unbounded on both counts - loadtest.py's aiohttp.TCPConnector uses limit=0 (deliberately, its own docstring says so, to not become the bottleneck itself) and nothing here capped the container underneath it.
    # At END_USERS=80+/SPEED=5 that pinned every core on the host VM hard enough to stall the Docker daemon itself, not just this stack - not a webhook/worker problem, a "this one tool had no ceiling" problem.
    # Caps here, not in loadtest.py: the whole point of a load *generator* is to push as hard as it can up to some limit - the limit just needs to be "this container", not "the whole host".
    # Actual process heap stays flat (~40-50MB, confirmed via resource.getrusage) regardless of END_USERS/corpus size - what used to climb straight to any mem_limit and trip the OOM killer was page cache from re-reading the (multi-GB, still growing) fixtures volume mount, charged to this cgroup and never dropped since _read_bytes() never revisits a file.
    # Fixed at the source with posix_fadvise(DONTNEED) after each read (see _read_bytes) - this limit is now just a sane ceiling, not load-bearing the way it was before that fix.
    # Real peak across several 100-user/SPEED=5 runs this session stayed 27-90MB (heap ~40-50MB) and well under 1 core - 768m/6.0 was sized for a pre-fix incident (see comment above), not actual usage.
    # Still a multiple of observed peak, not tight to it.
    mem_limit: 256m
    cpus: 2.0
    logging: *default-logging
    depends_on:
      load-balancer:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - receipt-goblin

  backup:
    # Backup/restore for clickhouse, litellm-db, grafana-data - see README.md's "Backup & restore" section.
    # Not started by `docker compose up` (profiles: tools) - run via `make backup-*`/`restore-*` or cron.
    # No docker exec/socket: clickhouse/litellm-db go over the network, grafana-data is the same named volume the `grafana` service uses.
    build:
      context: ./services/backup
      args:
        CLICKHOUSE_VERSION: *clickhouse-version
    image: receipt-goblin-backup:${BACKUP_TAG:?run via `make`, not `docker compose` directly - see VERSIONS.yml}
    container_name: receipt-goblin-backup
    profiles:
      - tools
    logging: *default-logging
    volumes:
      - ${BACKUP_DIR:-.backups}:/backups
      - grafana-data:/var/lib/grafana
    environment:
      CLICKHOUSE_HOST: *clickhouse-host
      # No CLICKHOUSE_NATIVE_PORT here, deliberately: backup_clickhouse.sh/
      # restore_clickhouse.sh connect to `clickhouse` directly over the
      # Docker network, never through nginx, so they shouldn't inherit the
      # public/nginx-published port var above - they fall back to their own
      # `${CLICKHOUSE_NATIVE_PORT:-9000}`, which matches clickhouse's actual
      # (hardcoded) internal port regardless of what the public one is set to.
      CLICKHOUSE_USER: *clickhouse-backup-user
      CLICKHOUSE_PASSWORD: *clickhouse-backup-password
      CLICKHOUSE_DATABASE: *clickhouse-database
      # restore_clickhouse.sh's DROP/RESTORE DATABASE need these, not the
      # backup user above (which only holds the BACKUP privilege, not DDL) -
      # see that script's own comment for why.
      CLICKHOUSE_BOOTSTRAP_USER: *clickhouse-bootstrap-user
      CLICKHOUSE_BOOTSTRAP_PASSWORD: *clickhouse-bootstrap-password
      LITELLM_DB_PASSWORD: *litellm-db-password
    mem_limit: 256m
    depends_on:
      clickhouse:
        condition: service_healthy
      litellm-db:
        condition: service_healthy
    networks:
      - receipt-goblin

  litellm:
    # config.yaml/entrypoint/user_configs all baked into the image at build
    # time in prod - a change (including a new/edited user_configs/*.yaml,
    # gitignored, may hold real hosts/keys) needs `docker compose build
    # litellm`. docker-compose.dev.yml bind-mounts user_configs/ back for
    # live editing without a rebuild - see services/litellm/Dockerfile.
    build: ./services/litellm
    image: receipt-goblin-litellm:${LITELLM_TAG:?run via `make`, not `docker compose` directly - see VERSIONS.yml}
    container_name: receipt-goblin-litellm
    environment:
      WEBHOOK_METRICS_URL: *webhook-metrics-url
      WEBHOOK_URL: *litellm-alert-webhook-url
      LITELLM_MASTER_KEY: *litellm-master-key
      DATABASE_URL: *litellm-db-url
      # Read by litellm's built-in langfuse callback (config.yaml) - one of
      # litellm's native integrations, so no callback_settings block needed.
      # Optional (not `:?`): Langfuse is opt-in (loaded via
      # docker-compose.langfuse.yml), and if unset litellm just logs a
      # per-call callback error and keeps working.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: *langfuse-base-url
    mem_limit: 2g
    cpus: 2.0
    labels:
      - autoheal=true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
    # No dependency on load-balancer here even though litellm's WEBHOOK_URL
    # points through it: load-balancer itself now depends on litellm being
    # healthy (it proxies litellm's port), so the reverse would be a cycle.
    # Not a functional problem either way - a webhook POST failing while
    # load-balancer/webhook are still starting just logs a per-call callback
    # error (same non-fatal pattern as the langfuse callback above), it
    # doesn't block litellm from serving requests.
    depends_on:
      litellm-db:
        condition: service_healthy
    networks:
      - receipt-goblin

  litellm-db:
    image: postgres:16-alpine
    container_name: receipt-goblin-litellm-db
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: *litellm-db-password
      POSTGRES_DB: litellm
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    restart: always
    labels:
      - autoheal=true
    logging: *default-logging
    networks:
      - receipt-goblin


networks:
  receipt-goblin:
    driver: bridge
    # Explicit subnet so webhook-1/webhook-2 (see their `networks:` blocks
    # above) can be pinned to fixed IPs - load-balancer/nginx.conf's
    # `upstream webhook_backend` addresses them by IP directly for real
    # least_conn balancing. `ip_range` carves out .0.0/24 for Docker's own
    # automatic allocation (every other service here) so it can never hand
    # out the same address a static assignment below already claims from
    # .1.0/24 - without this, whichever container happens to start first
    # grabs the low addresses and can collide with the pinned ones
    # (hit this in testing: litellm/mcp-dev got 172.28.0.11/.12 before
    # webhook-1/webhook-2 could claim them).
    ipam:
      config:
        - subnet: 172.28.0.0/16
          ip_range: 172.28.0.0/24

volumes:
  clickhouse-data:
  grafana-data:
  litellm-db-data:
  redis-data:
  loadtest-fixtures-data:
