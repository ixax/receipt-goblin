# Upstream ClickHouse server/client version pin - NOT a build-tag template like the
# entries below (no {build} substitution). Every image that installs
# clickhouse-server/clickhouse-client (services/clickhouse/Dockerfile's FROM,
# services/backup/Dockerfile's apt-pinned clickhouse-client/clickhouse-common-static)
# builds against this exact version - single source of truth so server and client
# never drift apart.
CLICKHOUSE_VERSION: 24.8.14.39

# Per-service-image-group version templates, resolved by
# scripts/resolve_image_version.py and exported as-is - each key below is
# already spelled as the exact env var docker-compose.yml's
# `image: ...:${..._TAG:?...}` lines reference, so there's no separate name
# transform (see resolve_image_version.py).
#
# `{build}` in a template is replaced with the current commit's short git
# hash - bump SEMVER by hand here on a real change to that image group, the
# hash then gives every commit touching it its own tag automatically instead
# of overwriting `latest` and orphaning the previous build as a dangling
# image (see git history for why this file exists at all). Every group
# outside the `observability`/`langfuse` profiles gets `{build}` - those two
# stay static (rarely-touched baked config on top of a public tool, see
# AGENTS.md "Dev/prod split") since there's no reason a commit to unrelated
# core-stack code should mint a new tag for e.g. loki and force a
# rebuild/repull of its base layers. Bump the SEMVER by hand instead, the
# same day you actually change one of those two groups' Dockerfile/config.
#
# One key can back several compose services at once - see
# docker-compose.yml's `image:` lines for which services use which key.
# webhook/worker/reparse/migrate/loadtest used to share one key
# (services/webhook/Dockerfile's one-image/APP_ROLE design) - split into
# five independent keys by the webhook-worker-split refactor, see
# plans/webhook-worker-split.md.

WEBHOOK_TAG: 0.4.1
WORKER_TAG: 0.3.1
REPARSE_TAG: 0.2.1
