# Read-only SQL validation for the `query` tool (src/server.py
# _validate_readonly_sql). Keep strict even though mcp-dev now also
# connects as its own DB-level read-only `mcp` ClickHouse user (see
# services/init/config.yml) - that's a second, independent
# enforcement layer (ClickHouse itself will reject any INSERT/DDL this
# user attempts), not a replacement for the app-level checks below.

# Tables this stack actually writes to - anything else (system.*, typos,
# etc.) is out of scope for `query`.
allowed_tables:
  - agent_events
  - agent_usage
  - agent_messages
  - agent_invocations
  - session_git_branch
  - ai_gateway_users
  - ai_gateway_groups
  - ingest_raw
  - ingest_dlq
  - litellm_alerts
  - plan_proposals
  - schema_migrations
  - clients
  # Narrow, deliberate exception to the system.* ban below (server.py's
  # _validate_readonly_sql special-cases "system.query_log" specifically -
  # this bare name alone doesn't grant access, the schema-qualifier check
  # does the real work): needed for query-performance introspection
  # (services/grafana/dashboards-health/query_performance.json).
  - query_log

# Word-boundary matched against the uppercased query - catches these
# anywhere (subqueries, CTEs), not just as the first keyword.
forbidden_keywords:
  - INSERT
  - UPDATE
  - DELETE
  - ALTER
  - DROP
  - TRUNCATE
  - CREATE
  - GRANT
  - REVOKE
  - ATTACH
  - DETACH
  - KILL
  - RENAME
  - OPTIMIZE
  - SYSTEM
  - EXCHANGE
  - RESTORE
  - BACKUP
  - SET

# Table functions reading outside the DB (files/URLs/other DBs) - always
# forbidden since they're function calls, not caught by the keyword list.
forbidden_table_functions:
  - REMOTE
  - REMOTESECURE
  - CLUSTER
  - CLUSTERALLREPLICAS
  - URL
  - FILE
  - S3
  - HDFS
  - MYSQL
  - POSTGRESQL
  - ODBC
  - JDBC
  - INPUT

max_rows_hard_cap: 1000

# Server-side throttle shared by query/profile_query - bounds real concurrent
# load on ClickHouse regardless of whether it comes from one query()'s
# batch-array fan-out or from unrelated agents calling the server at once.
max_concurrent_queries: 2

# Hard cap on queries per query() call when sql is a list.
max_batch_queries: 10

# ClickHouse `max_execution_time` (seconds) for `query`/`profile_query`.
# `max_execution_time_default_s` is used when a caller doesn't pass the
# tool's own `max_duration_s` parameter.
# `max_execution_time_hard_cap_s` is the absolute ceiling - a caller's
# `max_duration_s` is clamped to this, the same way `max_rows` is clamped
# to `max_rows_hard_cap` above.
max_execution_time_default_s: 10

# TEMPORARILY raised from 10 to unblock correctness/perf verification of
# panel-76 ("Trace"): its original (pre-optimization) rawSql doesn't
# complete within 10s even on a small session, so there was nothing to
# diff a rewrite's output against.
# Revert to 10 once that panel's optimization work is done.
max_execution_time_hard_cap_s: 60
