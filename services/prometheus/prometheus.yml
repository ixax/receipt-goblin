global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: clickhouse
    metrics_path: /metrics
    static_configs:
      - targets: ["clickhouse:9363"]

  - job_name: webhook
    metrics_path: /metrics
    static_configs:
      # Both stateless replicas, not a single `webhook` hostname - that
      # container name hasn't existed since the load-balanced split (see
      # docker-compose.yml's webhook-1/webhook-2). Each becomes its own
      # `instance` label; alert rules aggregate across them (see rules.yml).
      - targets: ["webhook-1:8000", "webhook-2:8000"]

  - job_name: mcp-dev
    metrics_path: /metrics
    static_configs:
      # Dev-only - reads DOWN/no-data when ENVIRONMENT=production, same as
      # the opt-in-profile langfuse targets below when their profile isn't
      # enabled (no alert rule wired to either case, so this doesn't page
      # anyone).
      - targets: ["mcp-dev:8001"]

  - job_name: mcp-stats
    metrics_path: /metrics
    static_configs:
      - targets: ["mcp-stats:8002"]

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9200"]

  - job_name: redis
    metrics_path: /metrics
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets: ["litellm:4000"]

  - job_name: load-balancer
    metrics_path: /metrics
    static_configs:
      # nginx-exporter (observability profile), not load-balancer directly -
      # nginx has no built-in /metrics, this scrapes its translated
      # stub_status output instead (see nginx-exporter's comment in
      # docker-compose.yml for what that does/doesn't cover).
      - targets: ["nginx-exporter:9113"]

  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["node-exporter:9100"]

  # HTTP probing of each service's health endpoint (see
  # services/blackbox/config.yml). Relabeling sends the target as a query
  # param to blackbox, then rewrites `instance` back to the target URL so
  # alert rules can match on it (instance=~".*webhook.*").
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://webhook-1:8000/health
          - http://webhook-2:8000/health
          - http://mcp-dev:8001/health
          - http://mcp-stats:8002/health
          - http://clickhouse:8123/ping
          - http://grafana:3000/api/health
          - http://litellm:4000/health/liveliness
          # The gateway itself (services/load-balancer/) - checked
          # separately from the two webhook replicas above, since it's its
          # own failure mode (nginx down/misconfigured) distinct from a
          # replica being down.
          - http://load-balancer:8000/health
          # Opt-in `langfuse` compose profile - probed unconditionally like
          # everything else above, so it just reads DOWN/no-data on the
          # Infra dashboard when the profile isn't enabled (no alert rule
          # wired to it, so this doesn't page anyone).
          - http://langfuse-web:3000/api/public/health
          - http://langfuse-clickhouse:8123/ping
          - http://langfuse-minio:9000/minio/health/live
          - http://langfuse-worker:3030/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Plain TCP-connect probing (see services/blackbox/config.yml's
  # tcp_connect module) for backends with no HTTP health endpoint at all -
  # langfuse-db (Postgres) and langfuse-redis. Just confirms the port
  # accepts a connection; same opt-in-profile/no-alert reasoning as the
  # langfuse-* targets in the `blackbox` job above.
  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - langfuse-db:5432
          - langfuse-redis:6379
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
