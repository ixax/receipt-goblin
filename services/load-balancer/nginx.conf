# Gateway in front of eight services: webhook (load-balanced across two
# stateless replicas), litellm, grafana, mcp-dev (dev-only), mcp-stats
# (prod), clickhouse (its HTTP interface for people/tools querying directly
# - clickhouse-client, DBeaver, ad-hoc curl - not just the app services that
# talk to it over the plain Docker network), prometheus (its own web UI -
# opt-in `observability` profile), and langfuse-web (opt-in `langfuse`
# profile). Each keeps its own `listen` port matching the host port it used
# to publish directly (docker-compose.yml's *webhook-port/*litellm-port/
# *grafana-port/*mcp-dev-port/*mcp-stats-port/*clickhouse-http-port/
# *clickhouse-native-port/*prometheus-port/*langfuse-port) - clients still
# hit http://localhost:<port> exactly as before, just via nginx now instead
# of straight to the container.
# langfuse-web's own container-internal port is 3000 (same as grafana's) -
# `listen 3001` below is just this nginx process's own internal socket, has
# nothing to do with langfuse-web's actual port or the host-side
# *langfuse-port mapping.
# Also serves a static landing page on `listen 80` (http://localhost, no
# host-side port var - always 80) linking every service above. Paths are
# baked in from index.html.template at build time, but the actual ports in
# those links are rendered in from the real configured env vars on every
# container start - see the Dockerfile and
# docker-entrypoint.d/50-render-index-html.sh.
#
# Every `location` below repeats the same `proxy_set_header Host $http_host;` +
# X-Real-IP/X-Forwarded-For/X-Forwarded-Proto trio, not just once at the
# `http{}` level: nginx only inherits a parent level's `proxy_set_header`
# directives into a location if that location defines none of its own: once a
# location sets even one (`Connection`, here, for keepalive), the parent
# set is skipped entirely and the built-in default takes over for anything
# not re-listed - which for Host is `$proxy_host` (the backend's own address,
# e.g. "grafana:3000"), not what the browser actually requested
# ("localhost:3000"). That mismatch against the browser's own Origin header
# is exactly what broke Grafana with "origin not allowed" the first time
# this gateway went live - forwarding the real Host (and the client-identity
# headers alongside it) fixes it.
worker_processes auto;

# Explicit rather than relying on the base image's compiled-in default
# (which also happens to land on /dev/stderr via the symlink at
# /var/log/nginx/error.log) - keeps the target and level visible here
# instead of implicit. Docker's log driver tags stderr lines separately
# from the access log's stdout lines (see services/alloy/config.alloy's
# `stream` label), so this is what feeds the dashboard's "Error log" tab.
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

# ClickHouse's native protocol (port 9000, used by clickhouse-client and any
# other native-protocol client) is a raw TCP protocol, not HTTP - needs the
# stream module, not a `server{}`/`location{}` in the `http{}` block below.
stream {
    resolver 127.0.0.11 valid=10s;

    server {
        listen 9000;
        # Variable, not a literal hostname - same reason as the `http`
        # block's comment below: a bare `proxy_pass clickhouse:9000;` gets
        # resolved once at startup/reload even with `resolver` set, and
        # never again. The variable form defers resolution to request time,
        # so it actually gets the periodic re-resolution.
        set $clickhouse_native_backend clickhouse:9000;
        proxy_pass $clickhouse_native_backend;
    }
}

http {
    # logfmt so Alloy's stage.logfmt can parse it directly - $backend_name is
    # set per-server below (landing page + stub_status opt out with their own
    # `access_log off;`, since they'd otherwise inherit this default).
    log_format backend_logfmt 'backend=$backend_name method=$request_method status=$status '
                               'bytes=$body_bytes_sent request_time=$request_time '
                               'upstream_time=$upstream_response_time remote_addr=$remote_addr '
                               'uri="$request_uri" host="$http_host"';
    access_log /dev/stdout backend_logfmt;

    # Grafana Live (its websocket channel, used for streaming/live dashboard
    # updates - /api/live/ws) needs the handshake's Upgrade header forwarded
    # and Connection set to "upgrade", not blanked like every other location
    # here does for keepalive. Maps a plain HTTP request (empty $http_upgrade)
    # to Connection: close instead - correct either way, since only the
    # grafana location below actually uses $connection_upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Landing page - static index.html (baked in at build time, see
    # Dockerfile) listing every service link below. Not a proxy: this is the
    # only `server{}` block in this file with no backend at all.
    server {
        listen 80;
        access_log off;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }

    # webhook-1/webhook-2 (see docker-compose.yml) get static IPs precisely so
    # this upstream block can use them directly: `least_conn` (route to
    # whichever replica has fewer active connections) only works with a
    # static `upstream{}` block, and open-source nginx (no nginx-plus)
    # resolves a `server <hostname>` entry once, at startup/reload, and never
    # again - a routine replica recreate would otherwise leave this block
    # proxying to a dead IP until nginx itself restarts (the DNS-based
    # workaround below exists for exactly that reason on the other four
    # backends). Static IPs sidestep the problem entirely: they don't change
    # across a recreate, so no re-resolution is needed here.
    upstream webhook_backend {
        least_conn;
        server 172.28.1.11:8000 max_fails=3 fail_timeout=5s;
        server 172.28.1.12:8000 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 8000;

        set $backend_name "webhook";

        # Payloads replay real Claude Code sessions - can run several hundred KB.
        client_max_body_size 20m;

        location / {
            proxy_pass http://webhook_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
    }

    # litellm/grafana/mcp-dev/mcp-stats are each a single backend - no balancing
    # choice to make, so no reason to pin IPs for them. Instead: resolve their
    # hostname via Docker's embedded DNS (127.0.0.11) periodically, so a
    # rebuild+recreate (`docker compose up -d --build <service>`) self-heals
    # within `valid` seconds instead of 502ing until nginx restarts - same
    # rationale as the webhook_backend comment above, just via DNS instead of
    # static IPs since there's nothing here to least_conn between.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 4000;

        # Claude Code/Codex sessions routed through here (ANTHROPIC_BASE_URL)
        # can push large request bodies (session history, attachments) and
        # hold long SSE streaming responses open - default nginx
        # client_max_body_size (1m) and default buffering/timeouts silently
        # broke both once traffic went through this gateway instead of
        # straight to litellm, surfacing as request failures that vanished
        # when pointed directly at the provider again.
        client_max_body_size 20m;

        set $backend_name "litellm";
        set $litellm_backend litellm:4000;

        location / {
            proxy_pass http://$litellm_backend;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 3000;

        set $backend_name "grafana";
        set $grafana_backend grafana:3000;

        location / {
            proxy_pass http://$grafana_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 3001;

        # DNS-resolved, not a static IP - same rationale as
        # litellm/grafana/mcp-dev/mcp-stats above (single backend, self-heals on
        # recreate). Fine if the `langfuse` profile isn't enabled at all:
        # unresolved backend just 502s per-request until it exists, same as
        # every other backend here before it's up.
        set $backend_name "langfuse-web";
        set $langfuse_web_backend langfuse-web:3000;

        location / {
            proxy_pass http://$langfuse_web_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 8001;

        set $backend_name "mcp-dev";
        set $mcp_dev_backend mcp-dev:8001;

        location / {
            proxy_pass http://$mcp_dev_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 8002;

        # mcp-stats is prod-facing (unlike mcp-dev above) - auth is handled
        # by the service itself (LiteLLM virtual key check), not here.
        set $backend_name "mcp-stats";
        set $mcp_stats_backend mcp-stats:8002;

        location / {
            proxy_pass http://$mcp_stats_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 9090;

        # DNS-resolved, not a static IP - same rationale as
        # litellm/grafana/mcp-dev/mcp-stats/langfuse-web above (single backend,
        # self-heals on recreate). Fine if the `observability` profile isn't
        # enabled at all: unresolved backend just 502s per-request until it
        # exists, same as every other backend here before it's up.
        set $backend_name "prometheus";
        set $prometheus_backend prometheus:9090;

        location / {
            proxy_pass http://$prometheus_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Internal only - not in docker-compose.yml's `ports:` for load-balancer,
    # just `expose`, since only the `nginx-exporter` (observability profile)
    # container scrapes this. stub_status only gives connection-level
    # counters (accepts/handled/requests/active), not per-handler rate or
    # any latency data - see AGENTS.md "Gateway (`load-balancer`)" for why
    # that's the ceiling of what nginx can report without a fancier module.
    server {
        listen 8080;
        access_log off;

        location /stub_status {
            stub_status;
        }
    }

    server {
        listen 8123;

        # People/tools hitting ClickHouse's HTTP interface directly (curl,
        # DBeaver, ad-hoc exports) can push large inserts or pull large
        # result sets - no fixed body cap, and buffering off so big
        # streamed SELECT responses aren't held in memory/disk before
        # forwarding.
        client_max_body_size 0;
        proxy_buffering off;

        set $backend_name "clickhouse";
        set $clickhouse_backend clickhouse:8123;

        location / {
            proxy_pass http://$clickhouse_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Analytical queries can run well past nginx's 60s proxy_read_timeout
            # default - not the ~30s webhook block above, this is people running
            # ad-hoc queries, not the low-latency ingest path.
            proxy_read_timeout 300s;
        }
    }
}
