# Role/grant config for ClickHouse provisioning - read once, by `make init`
# (services/init/init_clickhouse_users.py) only. Roles are created here and
# nowhere else - services/migrate/src/migrate.py never touches users/grants
# (see its own module docstring for why: role provisioning is a `make init`
# concern, not something re-run on every `docker compose up`).
#
# See services/init/ch_roles.py's module docstring for the exact (deliberately
# restricted, NOT general-YAML) grammar this file must stay within: a
# top-level `roles:` list, each entry a flat mapping of scalar fields plus one
# nested `grants:` list of strings. No flow style ({}/[]), no multi-line
# scalars, no anchors/references - if this file ever needs more than that,
# extend the parser deliberately rather than relying on syntax it doesn't
# actually support.

roles:
  - name: ingest
    user_env: CLICKHOUSE_INGEST_USER
    password_env: CLICKHOUSE_INGEST_PASSWORD
    default_user: ingest
    grants:
      - "GRANT INSERT ON {database}.*"
      - "GRANT SELECT ON {database}.agent_invocations"
      - "GRANT SELECT ON {database}.ingest_raw"
      - "GRANT SELECT ON {database}.session_git_branch"
      - "GRANT SELECT ON {database}.ai_gateway_users"
      - "GRANT SELECT ON {database}.ai_gateway_groups"
      # build_fixtures.py's phase-1 row selection (litellm_call_id,
      # session_id, timestamp WHERE status='success').
      - "GRANT SELECT ON {database}.agent_events"
      # reparse_dlq.py pages through ingest_dlq_unresolved (not ingest_dlq
      # directly - see migrations/015_ingest_dlq_resolved.sql) to replay
      # failed rows back into their original target table, then marks them
      # resolved - the only reader among the ingest role's own tools
      # (everything else only inserts). ingest_dlq_unresolved is a view
      # joining ingest_dlq_resolved internally - ClickHouse requires the
      # querying role to hold SELECT on every table a view touches, not
      # just the view name itself, so both underlying tables need an
      # explicit grant too (confirmed empirically 2026-08-05: querying the
      # view without this raises ACCESS_DENIED naming the missing table).
      - "GRANT SELECT ON {database}.ingest_dlq"
      - "GRANT SELECT ON {database}.ingest_dlq_resolved"
      - "GRANT SELECT ON {database}.ingest_dlq_unresolved"

  - name: grafana
    user_env: CLICKHOUSE_GRAFANA_USER
    password_env: CLICKHOUSE_GRAFANA_PASSWORD
    default_user: grafana
    grants:
      # Explicit per-table list, not "GRANT SELECT ON {database}.*".
      # Deliberately excludes ingest_raw (raw_payload_full holds
      # unprocessed request/response payloads verbatim; no dashboard panel
      # queries it - see agents_overview.json's own "no more JOIN to
      # ingest_raw" comment - and grafana has no business reading raw
      # traffic even if one someday tried to).
      # ingest_dlq IS granted below, unlike ingest_raw: it has an actual
      # triage panel (Infra Overview's "Ingest DLQ" tab, "Ingest DLQ
      # recent rows") that needs to read it, including raw_row.
      # ingest_dlq_resolved is granted too even though no panel queries it
      # directly - ingest_dlq_unresolved's view definition joins it
      # internally, and ClickHouse requires SELECT on every table a view
      # touches, not just the view name (confirmed empirically 2026-08-05:
      # ACCESS_DENIED naming ingest_dlq_resolved without this grant).
      - "GRANT SELECT ON {database}.agent_invocations"
      - "GRANT SELECT ON {database}.session_git_branch"
      - "GRANT SELECT ON {database}.plan_proposals"
      - "GRANT SELECT ON {database}.ai_gateway_groups"
      - "GRANT SELECT ON {database}.ai_gateway_users"
      - "GRANT dictGet ON {database}.ai_gateway_users_dict"
      - "GRANT dictGet ON {database}.session_git_branch_dict"
      - "GRANT SELECT ON {database}.clients"
      - "GRANT SELECT ON {database}.agent_events"
      - "GRANT SELECT ON {database}.agent_usage"
      - "GRANT SELECT ON {database}.agent_messages"
      - "GRANT SELECT ON {database}.litellm_alerts"
      - "GRANT SELECT ON {database}.ingest_dlq"
      - "GRANT SELECT ON {database}.ingest_dlq_resolved"
      - "GRANT SELECT ON {database}.ingest_dlq_unresolved"
      - "GRANT SELECT ON system.tables"
      # Query Performance (agents_overview) dashboard reads system.query_log directly.
      - "GRANT SELECT ON system.query_log"

  - name: mcp
    user_env: CLICKHOUSE_MCP_USER
    password_env: CLICKHOUSE_MCP_PASSWORD
    default_user: mcp
    grants:
      - "GRANT SELECT ON {database}.*"
      - "GRANT SELECT ON system.query_log"
      - "GRANT SYSTEM FLUSH LOGS ON *.*"
      - "GRANT dictGet ON {database}.ai_gateway_users_dict"
      - "GRANT dictGet ON {database}.session_git_branch_dict"
      - "GRANT dictGet ON {database}.person_identities_dict"
    # agent_messages.prompt_text/response_text are the raw prompts and replies.
    # No statistic needs their content - only their length, which `grafana` computes for its own panels under
    # its own role, so nothing an agent asks mcp-dev is worth handing it the text itself.
    # Carved out of the wildcard SELECT above rather than replacing that wildcard with a table allowlist: this
    # role's job is answering open questions about the data, so a table added later must stay readable by
    # default, while these two columns must stay unreadable by default.
    # Metadata columns of the same table (session_id, agent_name, timestamp, ...) are deliberately still
    # readable - they carry no conversation content and joins need them.
    revokes:
      - "REVOKE SELECT(prompt_text, response_text) ON {database}.agent_messages"

  - name: mcp_stats
    user_env: CLICKHOUSE_MCP_STATS_USER
    password_env: CLICKHOUSE_MCP_STATS_PASSWORD
    default_user: mcp_stats
    grants:
      # agent_usage for cost/token numbers, agent_events for calculated_type/
      # tool_name/calculated_payload - `me`'s top_operations labeling joins
      # the two (see services/mcp-stats/src/server.py's _operation_label).
      # Broaden further if/when mcp-stats grows tools reading more tables.
      - "GRANT SELECT ON {database}.agent_usage"
      - "GRANT SELECT ON {database}.agent_events"

  - name: backup
    user_env: CLICKHOUSE_BACKUP_USER
    password_env: CLICKHOUSE_BACKUP_PASSWORD
    default_user: backup
    grants:
      - "GRANT BACKUP ON {database}.*"

  - name: loadtest
    user_env: CLICKHOUSE_LOADTEST_USER
    password_env: CLICKHOUSE_LOADTEST_PASSWORD
    default_user: loadtest
    database_env: CLICKHOUSE_LOADTEST_DATABASE
    create_database: true
    grants:
      - "GRANT ALL ON {database}.*"
