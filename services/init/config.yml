# Role/grant config for ClickHouse provisioning - read once, by `make init`
# (services/init/init_clickhouse_users.py) only. Roles are created here and
# nowhere else - services/migrate/src/migrate.py never touches users/grants
# (see its own module docstring for why: role provisioning is a `make init`
# concern, not something re-run on every `docker compose up`).
#
# See services/init/ch_roles.py's module docstring for the exact (deliberately
# restricted, NOT general-YAML) grammar this file must stay within: a
# top-level `roles:` list, each entry a flat mapping of scalar fields plus one
# nested `grants:` list of strings. No flow style ({}/[]), no multi-line
# scalars, no anchors/references - if this file ever needs more than that,
# extend the parser deliberately rather than relying on syntax it doesn't
# actually support.

roles:
  - name: ingest
    user_env: CLICKHOUSE_INGEST_USER
    password_env: CLICKHOUSE_INGEST_PASSWORD
    default_user: ingest
    grants:
      - "GRANT INSERT ON {database}.*"
      - "GRANT SELECT ON {database}.agent_invocations"
      - "GRANT SELECT ON {database}.ingest_raw"
      - "GRANT SELECT ON {database}.session_git_branch"
      - "GRANT SELECT ON {database}.ai_gateway_users"
      - "GRANT SELECT ON {database}.ai_gateway_groups"
      # build_fixtures.py's phase-1 row selection (litellm_call_id,
      # session_id, timestamp WHERE status='success').
      - "GRANT SELECT ON {database}.agent_events"

  - name: grafana
    user_env: CLICKHOUSE_GRAFANA_USER
    password_env: CLICKHOUSE_GRAFANA_PASSWORD
    default_user: grafana
    grants:
      # Explicit per-table list, not "GRANT SELECT ON {database}.*" -
      # deliberately excludes ingest_raw/ingest_dlq (raw_payload_full/
      # raw_row hold unprocessed request/response payloads verbatim; no
      # dashboard panel queries either table - see agents_overview.json's
      # own "no more JOIN to ingest_raw" comment - and grafana has no
      # business reading raw traffic even if one someday tried to).
      - "GRANT SELECT ON {database}.agent_invocations"
      - "GRANT SELECT ON {database}.session_git_branch"
      - "GRANT SELECT ON {database}.plan_proposals"
      - "GRANT SELECT ON {database}.ai_gateway_groups"
      - "GRANT SELECT ON {database}.ai_gateway_users"
      - "GRANT dictGet ON {database}.ai_gateway_users_dict"
      - "GRANT dictGet ON {database}.session_git_branch_dict"
      - "GRANT SELECT ON {database}.clients"
      - "GRANT SELECT ON {database}.agent_events"
      - "GRANT SELECT ON {database}.agent_usage"
      - "GRANT SELECT ON {database}.agent_messages"
      - "GRANT SELECT ON system.tables"

  - name: mcp
    user_env: CLICKHOUSE_MCP_USER
    password_env: CLICKHOUSE_MCP_PASSWORD
    default_user: mcp
    grants:
      - "GRANT SELECT ON {database}.*"
      - "GRANT SELECT ON system.query_log"
      - "GRANT SYSTEM FLUSH LOGS ON *.*"

  - name: mcp_stats
    user_env: CLICKHOUSE_MCP_STATS_USER
    password_env: CLICKHOUSE_MCP_STATS_PASSWORD
    default_user: mcp_stats
    grants:
      # agent_usage for cost/token numbers, agent_events for calculated_type/
      # tool_name/calculated_payload - `me`'s top_operations labeling joins
      # the two (see services/mcp-stats/src/server.py's _operation_label).
      # Broaden further if/when mcp-stats grows tools reading more tables.
      - "GRANT SELECT ON {database}.agent_usage"
      - "GRANT SELECT ON {database}.agent_events"

  - name: backup
    user_env: CLICKHOUSE_BACKUP_USER
    password_env: CLICKHOUSE_BACKUP_PASSWORD
    default_user: backup
    grants:
      - "GRANT BACKUP ON {database}.*"

  - name: loadtest
    user_env: CLICKHOUSE_LOADTEST_USER
    password_env: CLICKHOUSE_LOADTEST_PASSWORD
    default_user: loadtest
    database_env: CLICKHOUSE_LOADTEST_DATABASE
    create_database: true
    grants:
      - "GRANT ALL ON {database}.*"
