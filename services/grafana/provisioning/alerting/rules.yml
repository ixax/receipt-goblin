apiVersion: 1

# No contact point wired up yet - these alert into Grafana's default
# receiver only (visible under Alerting > Alert rules), not delivered
# anywhere real. Add contactpoints.yml + a notification policy later.
groups:
  - orgId: 1
    name: llm-alerts
    folder: Alerts
    # Longer than infra-health's 30s: these run real ClickHouse SQL scans
    # (not cheap Prometheus instant vector lookups), backed by the queries
    # services/grafana/dashboards-health/infra_overview.json's "LiteLLM"
    # tab panels also use - see AGENTS.md for the ClickHouse datasource
    # (uid "clickhouse", grafana-clickhouse-datasource plugin).
    interval: 60s
    rules:
      - uid: alert-llm-error-rate-high
        title: LLM error rate is high
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: clickhouse
            model:
              refId: A
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: 1
              queryType: table
              rawSql: "SELECT countIf(status = 'failure') / greatest(count(), 1) AS ratio FROM agent_events WHERE timestamp >= now() - INTERVAL 15 MINUTE"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.05]}  # >5% failures over a rolling 15m window
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query

      - uid: alert-llm-p95-latency-high
        title: LLM p95 latency is high
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: clickhouse
            model:
              refId: A
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: 1
              queryType: table
              rawSql: "SELECT quantile(0.95)(latency_ms) AS p95_ms FROM agent_events WHERE timestamp >= now() - INTERVAL 15 MINUTE AND latency_ms IS NOT NULL"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [20000]}  # p95 > 20s over a rolling 15m window
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query

      - uid: alert-llm-native-alert-fired
        title: LiteLLM native alert fired
        condition: C
        for: 30s
        noDataState: NoData
        execErrState: Error
        # Presence-based, not threshold-based: any row means LiteLLM's own
        # alerting logic (budget/outage/exception/hang - see
        # general_settings.alerting in services/litellm/config.yaml) already
        # decided something is wrong.
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: clickhouse
            model:
              refId: A
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: 1
              queryType: table
              rawSql: "SELECT count() AS n FROM litellm_alerts WHERE received_at >= now() - INTERVAL 15 MINUTE"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query

      - uid: alert-llm-ingest-dlq-nonempty
        title: Ingest pipeline is dropping rows (ingest_dlq non-empty)
        condition: C
        for: 30s
        noDataState: NoData
        execErrState: Error
        # Presence-based: the ingestion pipeline itself (webhook-worker)
        # failed to insert into ClickHouse and fell back to ingest_dlq - see
        # AGENTS.md's insert_with_dlq_fallback.
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: clickhouse
            model:
              refId: A
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: 1
              queryType: table
              rawSql: "SELECT count() AS n FROM ingest_dlq_unresolved"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query

      - uid: alert-llm-claude-redirected
        title: Claude traffic redirected to real Anthropic API
        condition: C
        for: 30s
        noDataState: NoData
        execErrState: Error
        # Presence-based, mirrors panel-51 ("Redirected: Claude") in infra_overview.json's LiteLLM tab: counts load-balancer access-log lines tagged backend=anthropic-proxy-fallback - nonzero means litellm didn't respond and a request fell back to the real api.anthropic.com.
        # Loki datasource (uid DS_LOKI), not ClickHouse - alert rules can mix datasources across refIds within a group.
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: DS_LOKI
            model:
              refId: A
              datasource:
                type: loki
                uid: DS_LOKI
              editorMode: code
              expr: 'sum(count_over_time({container="receipt-goblin-load-balancer", stream="stdout", backend="anthropic-proxy-fallback"}[$__range]))'
              queryType: instant
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query

      - uid: alert-llm-codex-redirected
        title: Codex traffic redirected to real OpenAI API
        condition: C
        for: 30s
        noDataState: NoData
        execErrState: Error
        # Presence-based, mirrors panel-52 ("Redirected: Codex") in infra_overview.json's LiteLLM tab: counts load-balancer access-log lines tagged backend=openai-proxy-fallback - nonzero means litellm didn't respond and a request fell back to the real api.openai.com.
        # Loki datasource (uid DS_LOKI), not ClickHouse - alert rules can mix datasources across refIds within a group.
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: DS_LOKI
            model:
              refId: A
              datasource:
                type: loki
                uid: DS_LOKI
              editorMode: code
              expr: 'sum(count_over_time({container="receipt-goblin-load-balancer", stream="stdout", backend="openai-proxy-fallback"}[$__range]))'
              queryType: instant
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query

  - orgId: 1
    name: infra-health
    folder: Alerts
    interval: 30s
    rules:
      - uid: alert-clickhouse-down
        title: ClickHouse is down
        condition: C
        for: 30s
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              instant: true
              # Exact instance match, not a `.*clickhouse.*` regex: that also matched the unrelated langfuse-clickhouse blackbox probe (see prometheus.yml).
              # `+ on()` can't match one up{} series against two probe_success series, causing a many-to-many join error.
              # This alert is specifically about the app's own ClickHouse, not Langfuse's.
              expr: 'up{job="clickhouse"} + on() probe_success{job="blackbox", instance="http://clickhouse:8123/ping"}'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [2]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query

      - uid: alert-webhook-down
        title: Webhook is down
        condition: C
        for: 30s
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              instant: true
              # min(), not a bare `job="webhook"` match: that job now scrapes
              # two instances (webhook-1/webhook-2, see prometheus.yml), and
              # the blackbox side probes both individually too - without
              # aggregating each side down to a single series first, `+ on()`
              # would cross-join them into up to 4 series instead of the one
              # this alert (and its single stat panel in infra_overview.json)
              # expects. min() means "alert if ANY replica looks down",
              # same semantics the single old `webhook` container had.
              expr: 'min(up{job="webhook"}) + on() min(probe_success{job="blackbox", instance=~".*webhook.*"})'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [2]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query

      - uid: alert-load-balancer-down
        title: Load balancer is down
        condition: C
        for: 30s
        noDataState: NoData
        execErrState: Error
        # No own /metrics scrape job for load-balancer (plain nginx, no
        # exporter) - same pattern as alert-grafana-down below: blackbox
        # probe_success is the only signal.
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              instant: true
              expr: 'probe_success{job="blackbox", instance=~".*load-balancer.*"}'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query

      - uid: alert-mcp-stats-down
        # mcp-stats only, not mcp-dev: mcp-dev doesn't run in
        # ENVIRONMENT=production at all (see AGENTS.md's dev/prod split), so
        # an alert on it would misfire NoData in prod and be meaningless in
        # dev (you'd notice immediately if your own dev container were
        # down). mcp-stats ships in every environment, same as
        # litellm/grafana - it belongs here.
        title: mcp-stats is down
        condition: C
        for: 30s
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              instant: true
              expr: 'up{job="mcp-stats"} + on() probe_success{job="blackbox", instance=~".*mcp-stats.*"}'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [2]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query

      - uid: alert-redis-down
        title: Redis is down
        condition: C
        for: 30s
        noDataState: NoData
        execErrState: Error
        # No HTTP endpoint to blackbox-probe here - redis_exporter's own
        # up{job="redis"} is the only signal.
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              instant: true
              expr: 'up{job="redis"}'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query

      - uid: alert-litellm-down
        title: LiteLLM is down
        condition: C
        for: 30s
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              instant: true
              expr: 'up{job="litellm"} + on() probe_success{job="blackbox", instance=~".*litellm.*"}'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [2]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query

      - uid: alert-grafana-down
        title: Grafana is down
        condition: C
        for: 30s
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              instant: true
              expr: 'probe_success{job="blackbox", instance=~".*grafana.*"}'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query
