apiVersion: 1

# No contact point wired up yet - these alert into Grafana's default
# receiver only (visible under Alerting > Alert rules), not delivered
# anywhere real. Add contactpoints.yml + a notification policy later.
groups:
  - orgId: 1
    name: infra-health
    folder: Alerts
    interval: 30s
    rules:
      - uid: alert-clickhouse-down
        title: ClickHouse is down
        condition: C
        for: 30s
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              instant: true
              expr: 'up{job="clickhouse"} + on() probe_success{job="blackbox", instance=~".*clickhouse.*"}'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [2]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query

      - uid: alert-webhook-down
        title: Webhook is down
        condition: C
        for: 30s
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              instant: true
              # min(), not a bare `job="webhook"` match: that job now scrapes
              # two instances (webhook-1/webhook-2, see prometheus.yml), and
              # the blackbox side probes both individually too - without
              # aggregating each side down to a single series first, `+ on()`
              # would cross-join them into up to 4 series instead of the one
              # this alert (and its single stat panel in infra_overview.json)
              # expects. min() means "alert if ANY replica looks down",
              # same semantics the single old `webhook` container had.
              expr: 'min(up{job="webhook"}) + on() min(probe_success{job="blackbox", instance=~".*webhook.*"})'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [2]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query

      - uid: alert-load-balancer-down
        title: Load balancer is down
        condition: C
        for: 30s
        noDataState: NoData
        execErrState: Error
        # No own /metrics scrape job for load-balancer (plain nginx, no
        # exporter) - same pattern as alert-grafana-down below: blackbox
        # probe_success is the only signal.
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              instant: true
              expr: 'probe_success{job="blackbox", instance=~".*load-balancer.*"}'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query

      - uid: alert-mcp-stats-down
        # mcp-stats only, not mcp-dev: mcp-dev doesn't run in
        # ENVIRONMENT=production at all (see AGENTS.md's dev/prod split), so
        # an alert on it would misfire NoData in prod and be meaningless in
        # dev (you'd notice immediately if your own dev container were
        # down). mcp-stats ships in every environment, same as
        # litellm/grafana - it belongs here.
        title: mcp-stats is down
        condition: C
        for: 30s
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              instant: true
              expr: 'up{job="mcp-stats"} + on() probe_success{job="blackbox", instance=~".*mcp-stats.*"}'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [2]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query

      - uid: alert-redis-down
        title: Redis is down
        condition: C
        for: 30s
        noDataState: NoData
        execErrState: Error
        # No HTTP endpoint to blackbox-probe here - redis_exporter's own
        # up{job="redis"} is the only signal.
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              instant: true
              expr: 'up{job="redis"}'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query

      - uid: alert-litellm-down
        title: LiteLLM is down
        condition: C
        for: 30s
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              instant: true
              expr: 'up{job="litellm"} + on() probe_success{job="blackbox", instance=~".*litellm.*"}'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [2]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query

      - uid: alert-grafana-down
        title: Grafana is down
        condition: C
        for: 30s
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              instant: true
              expr: 'probe_success{job="blackbox", instance=~".*grafana.*"}'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query
