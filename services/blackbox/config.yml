modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: []  # defaults to 2xx
      preferred_ip_protocol: ip4
  # For TCP-only backends with no HTTP health endpoint (langfuse-db/
  # langfuse-redis) - just confirms the port accepts a connection, no
  # protocol-level handshake/auth.
  tcp_connect:
    prober: tcp
    timeout: 5s
