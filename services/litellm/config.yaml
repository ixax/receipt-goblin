model_list:
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: anthropic/claude-haiku-4-5
  - model_name: claude-opus-4-8
    litellm_params:
      model: anthropic/claude-opus-4-8
  - model_name: claude-fable-5
    litellm_params:
      model: anthropic/claude-fable-5
  # Forwards the caller's own `codex login` OAuth token instead of a shared
  # ChatGPT login - see custom_callbacks.py's "Codex/ChatGPT subscription
  # passthrough" section for why plain forward_client_headers can't do this.
  #
  # model_info.*_cost_per_token below isn't in LiteLLM's built-in cost map
  # (these model strings are Codex/ChatGPT-specific, not published OpenAI API
  # model names), so response_cost/cost_breakdown came back $0 for every
  # gpt-5.6-* call until this was added. Rates are OpenAI's public per-token
  # API pricing for these models (developers.openai.com/api/docs/models/
  # gpt-5.6-{sol,terra,luna}, confirmed 2026-07-25) - a cost proxy, not an
  # actual charge: usage here rides the caller's ChatGPT subscription, which
  # bills flat, not per token.
  - model_name: gpt-5.6-sol
    litellm_params:
      model: chatgpt/gpt-5.6-sol
    model_info:
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.00003
      cache_read_input_token_cost: 0.0000005
  - model_name: gpt-5.6-terra
    litellm_params:
      model: chatgpt/gpt-5.6-terra
    model_info:
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.000015
      cache_read_input_token_cost: 0.00000025
  - model_name: gpt-5.6-luna
    litellm_params:
      model: chatgpt/gpt-5.6-luna
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000006
      cache_read_input_token_cost: 0.0000001

general_settings:
  store_model_in_db: true
  store_prompts_in_spend_logs: true

  # Admin credential for /ui and /key/generate - not for day-to-day calls.
  master_key: os.environ/LITELLM_MASTER_KEY

  # Native alerting: budget/outage/exception/hang signals our own generic_api
  # StandardLoggingPayload callback below can't reconstruct - see AGENTS.md.
  # LiteLLM reads the webhook target from a hardcoded WEBHOOK_URL env var
  # with no config override, distinct from WEBHOOK_METRICS_URL below (that
  # one used to be named WEBHOOK_URL too, until the collision was found -
  # see docker-compose.yml's litellm service environment for both).
  # Deliberately excludes management-event types (key/team/user lifecycle,
  # new_model_added, spend_reports/daily_reports/fallback_reports digests) -
  # not reliability signals, would just add noise to a triage dashboard.
  alerting: ["webhook"]
  alert_types:
    - llm_exceptions
    - llm_too_slow
    - llm_requests_hanging
    - outage_alerts
    - db_exceptions
    - budget_alerts
    - failed_tracking_spend
  alerting_threshold: 300  # seconds; matches llm_too_slow/llm_requests_hanging trigger

  # Personal virtual keys go in this header regardless of route (see
  # README.md "LiteLLM"). Needed for OAuth-backed routes too - without it
  # LiteLLM can't tell "authed to me" from "caller's own Anthropic cred,
  # forward it" and strips Authorization before forwarding (litellm#19618).
  litellm_key_header_name: x-litellm-api-key

model_group_settings:
  # Forwards caller's own Authorization (OAuth token) to Anthropic - if a
  # model here moves to a real api_key, remove its name too or its
  # credential could still get forwarded.
  forward_client_headers_to_llm_api:
    - claude-sonnet-5
    - claude-haiku-4-5
    - claude-haiku-4-5-20251001
    - claude-opus-4-8
    - claude-fable-5
    - gpt-5.6-sol
    - gpt-5.6-terra
    - gpt-5.6-luna

litellm_settings:
  # NOTE: bare `success_callback: ["webhook"]` fires LiteLLM's *alerting*
  # webhook (thin Slack-style pings), not this. `generic_api` ships the
  # full StandardLoggingPayload (messages, response, usage, cost) instead.
  callbacks:
    - metrics_webhook
    # Copies x-claude-code-session-id into metadata.session_id so Langfuse
    # groups traces by CLI session.
    - custom_callbacks.session_id_handler
    # Forwards a Codex caller's own ChatGPT token to gpt-5.6-* models
    # instead of a shared login.
    - custom_callbacks.chatgpt_auth_forward_handler
    # Recovers Codex/ChatGPT streamed tool-call output that litellm's own
    # streaming iterator drops (BerriAI/litellm#25429) so
    # StandardLoggingPayload.response.output isn't empty for metrics_webhook.
    - custom_callbacks.chatgpt_responses_output_recovery_handler
    # Exposes /metrics on this proxy port (4000); scraped by Prometheus's
    # litellm job.
    - prometheus

  # Built-in /metrics auth expects the Authorization header, but this
  # project authenticates via x-litellm-api-key instead, so it always
  # rejects as malformed. Scraped only over the internal Docker network;
  # /metrics carries no secrets, so disabling auth is the escape hatch.
  require_auth_for_metrics_endpoint: false

  # Native LiteLLM integration - reads LANGFUSE_* env vars, needs no
  # callback_settings block. Ships every call as a trace (messages,
  # cost/usage, latency) grouped by metadata.session_id.
  success_callback:
    - langfuse
  failure_callback:
    - langfuse

callback_settings:
  metrics_webhook:
    callback_type: generic_api
    # Internal DNS name; no host port needed since only litellm talks to it.
    # WEBHOOK_METRICS_URL, not WEBHOOK_URL - that name is now LiteLLM's own
    # native alerting feature's hardcoded env var (general_settings.alerting
    # above), a separate target (/api/v1/litellm-alert, not /api/v1/metrics).
    endpoint: os.environ/WEBHOOK_METRICS_URL
    headers:
      Content-Type: application/json
    event_types:
      - llm_api_success
      - llm_api_failure
    log_format: json_array
    # GenericAPILogger defaults to max_retries=0 (litellm/integrations/generic_api/generic_api_callback.py) - a single 5xx/timeout flushing this batch to webhook was silently dropping up to batch_size events with zero retry (confirmed root cause of a real ~13min agent_usage/agent_events gap - see agent_docs/incidents.md).
    # Retries only on litellm.Timeout/httpx.TransportError/5xx (_should_retry_exception), exponential backoff (retry_delay * 2**attempt): 1s, 2s, 4s.
    max_retries: 3
    retry_delay: 1.0
